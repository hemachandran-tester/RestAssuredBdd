# Base URL
base.url=http://localhost:8081

# Endpoints
add.employee.endPoint =/assetManager/v1/employee/saveemployee

# Update Employee
update.employee.endpoint =/assetManager/v1/updateEmp/

# Save Asset Endpoint
save.asset.endpoint =/assetManager/v1/asset/saveAsset

# Add Admin URI
add.admin.endpoint = /assetManager/v1/admin/add/admin

# GET Employee List
get.employee.list = /assetManager/v1/employee/employeelist

# Get Asset List
get.assert.list = /assetManager/v1/asset/listOfAssets

# Get Asset By the ID
get.assert.by.SNO = /assetManager/v1/asset/id/{sno}

# Send OTP to mail
send.opt.to.mail = /reset-password/send-otp

# Verify OTP
verify.otp.mail = /reset-password/verify-otp